name: Keepalive 保活

# 目的：GitHub 会在仓库 60 天无活动时自动禁用 schedule workflow。
# 本 workflow 每月 1 号做一次空提交（重置 60 天计时器），
# 并通过 API 确保 cffex-daily workflow 处于启用状态（双保险）。

on:
  schedule:
    - cron: '0 3 1 * *'  # 每月 1 号 03:00 UTC（11:00 CST）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empty commit to keep repo active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive 空提交（防止 schedule workflow 被 60 天自动禁用）"
          git push

      - name: Ensure daily workflow stays enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            /repos/${{ github.repository }}/actions/workflows/cffex-daily.yml/enable \
            || echo "enable 调用失败（可能本就处于启用状态），忽略"
